world_model_node:
  ros__parameters:
    world_model:
      scene_discovery:
        # Keep the proven grip-at-top association settings while recording
        # request-local raw detector observations for offline review.
        min_detector_confidence: 0.40
        association_max_distance_m: 0.25
    scene_discovery:
      capture:
        enabled: true
        # Relative to the process working directory; override this in a
        # launch invocation when storing a labelled dataset elsewhere.
        # The transport plugin derives /seyond/points/cloudini from this
        # base topic and decodes it to the PointCloud2 saved in cloud.pcd.
        cloud_topic: /seyond/points
        cloud_transport: cloudini
        dir: scene_discovery_capture
        cloud_max_delta_s: 0.005
    debug:
      scene_discovery_dump:
        # Keep the timestamped rail TFs with each capture so the exact
        # self-filter geometry can be replayed and scored offline.
        tf_frames:
          - K0_mounting_base
          - elastic/K9
          - elastic/K10_left_rail
          - elastic/K11
          - elastic/K12_right_rail
          # Preserve the FK source used by the detector's optional pose prior
          # so future captured scenes remain replayable with that evidence.
          - elastic/K8_tool_center_point
