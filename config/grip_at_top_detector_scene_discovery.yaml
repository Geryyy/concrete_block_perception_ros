concrete_block_detector:
  ros__parameters:
    rgb_edge_prior:
      # Optional classical RGB tie-breaker for overlapping geometric cuboid
      # hypotheses. Missing/stale RGB, camera calibration, or TF is a no-op.
      enabled: true
      image_topic: /blackfly_rotated/image_rect
      camera_info_topic: /blackfly_rotated/camera_info
      max_sync_delta_s: 0.08
      weight: 0.05
      max_image_dimension_px: 768
    pose_priors:
      fk:
        # Timestamped FK resolves the 90-degree / roll ambiguity for a block
        # in the PZS100. It only re-ranks geometry-supported candidates; a TF
        # failure or an absent block leaves normal scene discovery unchanged.
        tcp_frame: elastic/K8_tool_center_point
        tcp_to_block_xyz: [0.0, 0.0, 0.85]
        tcp_to_block_rpy: [3.14159265, 0.0, 0.0]
        weight: 0.35
        translation_tolerance_m: 0.35
        orientation_tolerance_rad: 0.70
    detector:
      # Full-cloud, ray-aware evidence gate.  Matches blockpose's documented
      # scene-discovery threshold; no scene bounds or point filtering is used.
      min_score: 0.4
      # This bag contains free blocks resting on the fitted support surface.
      # Reject elevated hardware-shaped hypotheses, while the portable
      # detector default remains suitable for raised/stacked blocks.
      cluster_max_center_z: 1.2
      # Scene discovery assumes loose blocks resting on support. Keep the
      # plane-derived top direction if SDF is pulled away from gravity by
      # gripper clutter; its refined translation and yaw are retained.
      refine_preserve_top_axis_if_gravity_worsens: true
      # The real replay contains more than eight valid clutter components.
      # A labelled free block was otherwise truncated before plane fitting.
      proposal_max_components: 16
    gripper_self_filter:
      # The missed labelled block in grip_at_top is merged with gripper-side
      # clutter before cuboid proposal generation. The K9->K10 and K11->K12
      # FK lines form the inside faces of two outward-facing exclusion boxes.
      # Sensor-ray evidence stays unmodified.
      enabled: true
      publish_markers: true
      # A box's local X follows parent->rail, local Y points outward, and
      # local Z spans across the rail. Tune these while viewing the cyan boxes.
      outboard_extent_m: 0.30
      cross_rail_extent_m: 0.9
      rail_end_margin_m: 0.0
      left_rail:
        parent_frame: elastic/K9
        rail_frame: elastic/K10_left_rail
        # Screenshot/FK: K9 local +Z points left, outboard of the gripper.
        outward_axis_local: [0.0, 0.0, 1.0]
      right_rail:
        parent_frame: elastic/K11
        rail_frame: elastic/K12_right_rail
        # Screenshot/FK: K11 local +Z points right, outboard of the gripper.
        outward_axis_local: [0.0, 0.0, 1.0]
